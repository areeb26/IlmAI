<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IlmAI - Quick Actions</title>
  <link href="../dist/styles.css" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="w-80 bg-gray-50 dark:bg-gray-900">
  <div class="p-4">
    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center space-x-2">
        <img src="../assets/icons/icon48.png" alt="IlmAI" class="w-8 h-8">
        <h1 class="text-xl font-bold text-gray-900 dark:text-white">IlmAI</h1>
      </div>
      <button id="settingsBtn" class="p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg transition">
        <svg class="w-5 h-5 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
      </button>
    </div>

    <!-- Current Page Info -->
    <div id="pageInfo" class="mb-4 p-3 bg-white dark:bg-gray-800 rounded-lg shadow-sm">
      <div class="flex items-start space-x-3">
        <div id="pageThumbnail" class="w-16 h-12 bg-gray-200 dark:bg-gray-700 rounded flex-shrink-0"></div>
        <div class="flex-1 min-w-0">
          <h3 id="pageTitle" class="text-sm font-medium text-gray-900 dark:text-white truncate">Loading...</h3>
          <p id="pageUrl" class="text-xs text-gray-500 dark:text-gray-400 truncate">...</p>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="space-y-2">
      <button id="captureBtn" class="w-full flex items-center space-x-3 p-3 bg-primary-600 hover:bg-primary-700 text-white rounded-lg transition shadow-sm">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
        </svg>
        <span class="font-medium">Capture & Transcribe</span>
      </button>

      <button id="openSidepanelBtn" class="w-full flex items-center space-x-3 p-3 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 border border-gray-200 dark:border-gray-700 rounded-lg transition">
        <svg class="w-5 h-5 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        <span class="text-gray-700 dark:text-gray-300">Open Notes Panel</span>
      </button>

      <button id="searchBtn" class="w-full flex items-center space-x-3 p-3 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 border border-gray-200 dark:border-gray-700 rounded-lg transition">
        <svg class="w-5 h-5 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <span class="text-gray-700 dark:text-gray-300">Search Notes</span>
      </button>
    </div>

    <!-- Stats -->
    <div id="stats" class="mt-4 p-3 bg-gradient-to-r from-purple-50 to-blue-50 dark:from-purple-900/20 dark:to-blue-900/20 rounded-lg">
      <div class="grid grid-cols-3 gap-2 text-center">
        <div>
          <div id="totalNotes" class="text-lg font-bold text-gray-900 dark:text-white">0</div>
          <div class="text-xs text-gray-600 dark:text-gray-400">Notes</div>
        </div>
        <div>
          <div id="totalHours" class="text-lg font-bold text-gray-900 dark:text-white">0</div>
          <div class="text-xs text-gray-600 dark:text-gray-400">Hours</div>
        </div>
        <div>
          <div id="apiStatus" class="text-lg font-bold text-green-600 dark:text-green-400">✓</div>
          <div class="text-xs text-gray-600 dark:text-gray-400">API</div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="mt-4 pt-3 border-t border-gray-200 dark:border-gray-700">
      <div class="flex items-center justify-between text-xs text-gray-500 dark:text-gray-400">
        <span>v1.0.0</span>
        <a href="#" id="helpLink" class="hover:text-primary-600">Help & Docs</a>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
